<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificador de horarios · Publicidad y RRPP · UVa Segovia 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14131A;
  --ink-2:#3A3947;
  --ink-3:#6E6D7E;
  --lienzo:#EFEFF3;
  --panel:#FFFFFF;
  --linea:#E1E1E9;
  --linea-2:#F0F0F5;
  --granate:#7A1E2E;
  --alerta:#C0392B;
  --aviso:#8A5A12;
  --r:14px;
  --sombra:0 1px 1px rgba(20,19,26,.04), 0 8px 24px -12px rgba(20,19,26,.22);
  --display:"Bricolage Grotesque", "Inter Tight", system-ui, sans-serif;
  --ui:"Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ui);background:var(--lienzo);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
:focus-visible{outline:2px solid var(--granate);outline-offset:2px}

/* ───────── cabecera ───────── */
header.top{background:linear-gradient(135deg,#14131A 0%,#1E1D2A 100%);color:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,255,255,.06)}
.top-in{max-width:1900px;margin:0 auto;padding:10px 30px 0;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kicker{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#7A7990;margin-bottom:2px}
.marca h1{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:0;letter-spacing:-.03em}
.marca h1 em{font-style:normal;font-weight:500;color:#6E6D82;font-size:16px;margin-left:6px}
.metricas{display:flex;gap:6px;padding-bottom:0}
.metrica{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 14px;text-align:center}
.metrica b{display:block;font-family:var(--mono);font-size:18px;font-weight:500;line-height:1;letter-spacing:-.02em}
.metrica span{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#8E8DA0;margin-top:3px}
.metrica.mal{border-color:rgba(255,100,80,.3);background:rgba(255,80,60,.1)}
.metrica.mal b{color:#FF8A80}
.top-tabs{max-width:1900px;margin:8px auto 0;padding:0 30px 8px;display:flex;gap:16px;align-items:center}
.tabs-cuat{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.tab{background:none;border:0;color:#8E8DA0;padding:6px 18px;font-size:12px;font-weight:600;border-radius:8px;letter-spacing:-.005em;transition:all .15s}
.tab[aria-selected="true"]{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tab:hover:not([aria-selected="true"]){color:#ddd;background:rgba(255,255,255,.05)}
.tabs-sep{width:1px;height:22px;background:#3A3950;margin:0 2px;flex:none}
.tabs-pag{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.tab-pag{background:none;border:0;color:#8E8DA0;padding:6px 18px;font-size:12px;font-weight:600;border-radius:8px;letter-spacing:-.005em;display:flex;align-items:center;gap:6px;transition:all .15s}
.tab-pag[aria-selected="true"]{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tab-pag:hover:not([aria-selected="true"]){color:#ddd;background:rgba(255,255,255,.05)}
.tab-pag .tp-ico{font-size:13px}

/* ───────── paginas ───────── */
.pagina{max-width:1900px;margin:0 auto;display:none}
.pagina.activa{display:block}

/* ─── pag horario: calendario a pantalla completa ─── */
.pag-horario{padding:14px 20px 28px}
.pag-horario .panel{width:100%}

/* ─── pag asignaturas: dos columnas ─── */
.pag-asigs{padding:14px 20px 28px}
.dos-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

.panel{background:var(--panel);border:1px solid var(--linea);border-radius:16px;box-shadow:0 1px 2px rgba(20,19,26,.04),0 4px 20px -8px rgba(20,19,26,.12);overflow:hidden;min-width:0}

/* ───────── nav movil inferior ───────── */
.mob-nav{display:none}
.panel-h{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linea-2)}
.panel-h h2{margin:0;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.015em}
.panel-h .acciones{margin-left:auto}
.cuenta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

/* ───────── filtros ───────── */
.filtros{padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--linea-2);background:#FBFBFD}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.buscador{width:100%;padding:9px 12px;border:1px solid var(--linea);border-radius:10px;background:#fff}

/* ───────── catálogo ───────── */
.lista{max-height:min(60vh,580px);overflow:auto;padding:8px}
.grupo-titulo{display:flex;align-items:center;gap:10px;padding:14px 8px 8px;margin-top:6px;border-top:1px solid var(--linea-2)}
.grupo-titulo:first-child{border-top:0;margin-top:0}
.grupo-titulo b{font-family:var(--display);font-size:13px;font-weight:700}
.grupo-titulo span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);background:#F0F0F5;padding:2px 8px;border-radius:5px}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:1.5px solid transparent;border-radius:12px;padding:10px 12px;transition:all .12s}
.item:hover{background:#F6F6FB;border-color:#E8E8F0}
.item.activo{background:#F0F0FA;border-color:var(--linea)}
.tick{flex:none;width:20px;height:20px;border:2px solid var(--linea);border-radius:7px;display:grid;place-items:center;font-size:12px;color:#fff;background:#fff;margin-top:1px;transition:all .12s}
.item.activo .tick{border-color:transparent}
.item .nom{font-size:13.5px;font-weight:600;line-height:1.3;display:block;letter-spacing:-.01em}
.item .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tag{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 7px;border-radius:6px;background:#F0F0F5;color:var(--ink-3);letter-spacing:.02em}
.tag.op{background:#EDEBF8;color:#4A3E8E}
.tag.elige{background:#FDF0E4;color:#8A5A12}

/* ───────── selección ───────── */
.sel-cuerpo{padding:8px;max-height:min(60vh,620px);overflow:auto}
.vacio{padding:34px 22px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.6}
.curso-cab{display:flex;align-items:center;gap:10px;padding:14px 8px 8px;margin-top:6px;border-top:1px solid var(--linea-2)}
.curso-cab:first-child{border-top:0;margin-top:0}
.curso-num{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1}
.curso-cab .barra{flex:1;height:1px;background:var(--linea-2)}
.curso-cab .ects{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.tarjeta{position:relative;border:1.5px solid var(--linea);border-radius:14px;margin:8px 2px;background:#fff;overflow:hidden;transition:all .15s}
.tarjeta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.tarjeta.otro{opacity:.45}
.tarjeta:hover{border-color:#C5C5D5;box-shadow:0 2px 10px rgba(20,19,26,.08)}
.t-h{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 10px 16px}
.t-h .nom{flex:1;font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.t-sub{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.mini{background:none;border:1px solid var(--linea);border-radius:8px;width:28px;height:28px;font-size:12px;line-height:1;color:var(--ink-3);flex:none;display:grid;place-items:center;transition:all .12s}
.mini:hover{background:#F3F3F8;color:var(--ink)}
/* boton cerrar modal grande */
.m-cerrar{width:38px;height:38px;border-radius:50%;background:#F0F0F5;border:none;font-size:18px;color:var(--ink-2);display:grid;place-items:center;flex:none;transition:all .12s}
.m-cerrar:hover{background:#E0E0EA;color:var(--ink)}
.ficha{padding:2px 12px 12px 14px;border-top:1px solid var(--linea-2);display:flex;flex-direction:column;gap:9px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.campo select,.campo input,.campo textarea{padding:7px 9px;border:1px solid var(--linea);border-radius:9px;background:#FBFBFD;width:100%}
.campo textarea{min-height:54px;resize:vertical;line-height:1.45}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fijo{font-size:11.5px;color:var(--ink-3);background:#F6F6FA;border-radius:8px;padding:6px 9px}
.et{font-family:var(--mono);font-size:9px;font-weight:500;padding:2px 6px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase}
.et.ir{background:#E2F1EC;color:#1F6F4E}
.et.importante{background:#FFF3E0;color:#E65100;border:1px solid #FFB300}
.et.muy-importante{background:#FFEBEE;color:#C62828;border:1px solid #FF1744;animation:pulse-ext 2s infinite}
.et.no-urgente{background:#EEEEF4;color:var(--ink-3)}

/* ───────── barra vista ───────── */
.barra{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--linea-2);background:#fff}
.seg{display:flex;background:#F0F0F5;border-radius:12px;padding:3px;gap:1px}
.seg button{border:0;background:none;padding:8px 16px;font-size:12.5px;font-weight:600;border-radius:10px;color:var(--ink-3);transition:all .15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,19,26,.12)}
.acciones{display:flex;gap:5px;flex-wrap:wrap}
.btn{border:1.5px solid var(--linea);background:#fff;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--ink-2);transition:all .15s}
.btn:hover{background:#F3F3F8;color:var(--ink);border-color:#D0D0DB;transform:translateY(-1px)}
.btn.ppal{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ppal:hover{background:#2A2935;color:#fff;transform:translateY(-1px)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ───────── avisos ───────── */
.aviso-caja{padding:11px 16px;border-bottom:1px solid var(--linea-2);font-size:12.5px;line-height:1.5}
.aviso-caja.rojo{background:#FDF3F2;color:#8E2A1E}
.aviso-caja.ambar{background:#FDF8EF;color:var(--aviso)}
.aviso-caja b{font-weight:700}
.aviso-caja ul{margin:6px 0 0;padding-left:17px}
.aviso-caja li{margin-bottom:3px}

/* ───────── leyenda ───────── */
.leyenda{display:block;padding:0;border-bottom:1px solid var(--linea-2);background:linear-gradient(180deg,#FBFBFD,#F7F7FA)}
.ley-fila{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px;align-items:center}
.ley-fila + .ley-fila{border-top:1px dashed var(--linea-2);padding-top:6px;padding-bottom:6px}
.ley-rot{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-right:3px}
.ley{display:flex;align-items:center;gap:5px;font-size:11.5px;background:#fff;border:1px solid var(--linea);border-radius:8px;padding:4px 8px 4px 5px;cursor:pointer;transition:all .12s}
.ley:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 2px 8px rgba(20,19,26,.1)}
.ley i{width:11px;height:11px;border-radius:3px;flex:none}
.ley .ln{font-weight:500;letter-spacing:-.01em;font-size:11px}
.ley .lm{font-family:var(--mono);font-size:8px;color:var(--ink-3);letter-spacing:.04em}
.ley-tipo{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-2);background:#fff;border:1px solid var(--linea-2);border-radius:8px;padding:4px 8px 4px 5px}
.muestra{width:22px;height:12px;border-radius:3px;background:var(--ink-3);position:relative;flex:none}
.muestra.pa::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(255,255,255,.55)}
.muestra.lb::after{content:"";position:absolute;inset:0;border-radius:3px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)}
.dim .bq{opacity:.16}
.dim .bq.on{opacity:1}

/* ───────── tablas oficiales rediseñadas ───────── */
.of-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--linea-2);background:#FBFBFD}
.of-ctrl .ley-rot{margin:0 2px 0 0}
.of-ctrl .sep{width:1px;height:20px;background:var(--linea);margin:0 4px}
.of-tit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 10px}
.of-tit h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.025em}
.of-tit span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.of-pista{padding:0 16px 10px;font-size:12px;color:var(--ink-3)}
.of-cal .bq{cursor:pointer}
.bq.nomia{opacity:.52}
.bq.nomia:hover{opacity:.9}
.bq.mia{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.of-prof{margin:6px 16px 20px;width:calc(100% - 32px)}
.of-prof tr.sel td{background:#FBFBFD;font-weight:600}
.of-prof td.pill-c{width:26px}
.pto{display:inline-block;width:11px;height:11px;border-radius:4px}

/* ───────── glosario dentro de la ficha ───────── */
.glos{background:#FBFBFD;border:1px solid var(--linea-2);border-radius:12px;padding:13px 14px}
.glos dl{display:grid;grid-template-columns:auto 1fr;gap:7px 11px;margin:0;font-size:12px;line-height:1.45;color:var(--ink-2)}
.glos dt{font-family:var(--mono);font-size:10px;color:var(--ink);background:#EEEEF4;border-radius:6px;padding:2px 7px;height:fit-content;white-space:nowrap}
.glos dd{margin:0}

/* ───────── calendario ───────── */
.cal-wrap{padding:4px 6px 10px}
.cal-cab{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr));border-bottom:2px solid var(--linea);position:sticky;top:0;background:#fff;z-index:4}
.cal-cab div{padding:10px 4px 8px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.cal-cab div:first-child{color:transparent}
.cal-cuerpo{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr));position:relative}
.horas{position:relative;border-right:2px solid var(--linea)}
.hm{position:absolute;left:0;right:6px;text-align:right;font-family:var(--mono);font-size:11.5px;color:#6E6D82;transform:translateY(-7px);font-weight:700}
.dia{position:relative;border-right:1px solid #E8E8F0;padding:0 2px}
.dia:last-child{border-right:0}
.dia:nth-child(odd){background:rgba(0,0,0,.018)}
.raya{position:absolute;left:0;right:0;border-top:1px solid #EEEEF5}
.raya.h{border-top-color:#D8D8E5}

/* ── bloques de asignatura ── */
.bq{position:absolute;border-radius:10px;padding:5px 8px 4px 10px;overflow:hidden;color:#1A1828;line-height:1;box-shadow:0 1px 4px rgba(20,19,26,.1);transition:filter .12s,box-shadow .12s,transform .12s;border:1.5px solid rgba(0,0,0,.1);display:flex;flex-direction:column;justify-content:center;gap:2px}
.bq .bq-nombre{font-weight:700;font-size:12px;letter-spacing:-.02em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bq.bq-tall .bq-nombre{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bq .bq-detalle{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:rgba(0,0,0,.5);line-height:1.2}
.bq .bq-detalle .bq-h{font-weight:600;color:rgba(0,0,0,.6)}
.bq .tipo{position:absolute;top:4px;right:5px;font-family:var(--mono);font-size:7.5px;font-weight:800;background:rgba(0,0,0,.08);border-radius:4px;padding:1px 4px;letter-spacing:.04em;color:rgba(0,0,0,.45);line-height:1.3}
.bq.aula::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(0,0,0,.12)}
.bq.lab::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.04) 0 4px,transparent 4px 8px);pointer-events:none}
/* desdoble */
.bq.desdoble{border-style:dashed;border-width:2px;border-color:rgba(0,0,0,.22)}
.bq.desdoble .tipo::after{content:" ×2";font-weight:400;opacity:.7}
.bq.choca{box-shadow:0 0 0 2px #14131A, 0 0 0 4px #FFD400}
.bq .warn{position:absolute;bottom:2px;right:4px;font-size:8px}
/* importancia */
.bq.bq-imp{box-shadow:0 0 0 2.5px #FFB300,0 2px 8px rgba(255,179,0,.3)}
.bq.bq-muyimp{box-shadow:0 0 0 3px #FF1744,0 0 14px rgba(255,23,68,.35);animation:glow-imp 2s ease-in-out infinite}
@keyframes glow-imp{0%,100%{box-shadow:0 0 0 3px #FF1744,0 0 8px rgba(255,23,68,.25)}50%{box-shadow:0 0 0 3px #FF1744,0 0 18px rgba(255,23,68,.45)}}
.cal-vacio{padding:60px 24px;text-align:center;color:var(--ink-3);line-height:1.7;font-size:14px}

/* ── vista diaria ── */
.seg-dia{align-items:center}
.seg-dia .dia-nombre{min-width:100px;text-align:center;font-weight:700;color:var(--ink);font-size:13px}
.dia-wrap{padding:8px 12px 16px}
.dia-cab{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:8px 0 6px;text-align:center;border-bottom:2px solid var(--linea)}
.dia-grid{display:grid;grid-template-columns:52px 1fr;position:relative}
.dia-horas{position:relative;border-right:2px solid var(--linea)}
.dia-hm{position:absolute;left:0;right:6px;text-align:right;font-family:var(--mono);font-size:11px;color:#6E6D82;transform:translateY(-7px);font-weight:700}
.dia-col{position:relative}
.dia-raya{position:absolute;left:0;right:0;border-top:1px solid #EEEEF5}
.dia-raya.h{border-top-color:#D8D8E5}
.dia-bq{position:absolute;left:8px;right:8px;border-radius:14px;padding:12px 14px;color:#1A1828;box-shadow:0 2px 8px rgba(20,19,26,.1);border:1.5px solid rgba(0,0,0,.1);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:all .12s}
.dia-bq:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(20,19,26,.15)}
.dia-bq .dia-bq-nombre{font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.25}
.dia-bq .dia-bq-info{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:rgba(0,0,0,.5)}
.dia-bq .dia-bq-info b{font-weight:700;color:rgba(0,0,0,.65)}
.dia-bq .dia-bq-tipo{font-family:var(--mono);font-size:9px;font-weight:700;background:rgba(0,0,0,.07);border-radius:5px;padding:2px 7px;color:rgba(0,0,0,.45);align-self:flex-start}
.dia-bq.aula::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:14px 0 0 14px;background:rgba(0,0,0,.1)}
.dia-bq.lab::after{content:"";position:absolute;inset:0;border-radius:14px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.03) 0 5px,transparent 5px 10px);pointer-events:none}
.dia-vacio{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px}

/* ───────── tablas oficiales ───────── */
.oficial{padding:16px}
.of-h{display:flex;align-items:baseline;gap:10px;margin:20px 0 8px}
.of-h:first-child{margin-top:0}
.of-h h3{font-family:var(--display);font-size:16px;font-weight:700;margin:0;letter-spacing:-.02em}
.of-h span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.of-tabla{border:1px solid var(--linea);border-radius:11px;overflow:hidden}
.of-fila{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.of-fila.cab div{background:#F6F6FA;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:8px;text-align:center}
.of-fila > div{border-right:1px solid var(--linea-2);border-top:1px solid var(--linea-2);padding:8px;min-height:60px}
.of-fila.cab > div{border-top:0}
.of-fila > div:last-child{border-right:0}
.celda{border-left:3px solid var(--c);padding-left:7px;margin-bottom:9px}
.celda .franja{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em}
.celda .cn{font-size:12px;font-weight:600;line-height:1.25;margin:1px 0 2px;letter-spacing:-.01em}
.celda .det{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);line-height:1.5}
.celda .aul{font-size:10px;color:var(--ink-3)}
.of-prof{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.of-prof th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:7px 9px;background:#F6F6FA;border:1px solid var(--linea-2)}
.of-prof td{padding:7px 9px;border:1px solid var(--linea-2)}
.of-prof td.ects{font-family:var(--mono);text-align:center;width:66px}
.of-prof td.vacio-p{color:#B4B3C2;font-style:italic}

/* ───────── nota ───────── */
.nota{padding:20px 24px;max-width:78ch;line-height:1.65;font-size:13.5px}
.nota h3{font-family:var(--display);font-size:18px;margin:0 0 10px;letter-spacing:-.02em}
.nota h4{font-family:var(--display);font-size:13.5px;margin:20px 0 5px}
.nota p{margin:0 0 10px;color:var(--ink-2)}
.nota ul{margin:0 0 10px;padding-left:19px;color:var(--ink-2)}
.nota li{margin-bottom:5px}
.nota code{font-family:var(--mono);font-size:11.5px;background:#F0F0F5;padding:1px 5px;border-radius:5px}


/* ───────── ventana emergente ───────── */
.velo{position:fixed;inset:0;background:rgba(20,19,26,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:90;display:grid;place-items:center;padding:22px;opacity:0;pointer-events:none;transition:opacity .18s ease}
.velo.on{opacity:1;pointer-events:auto}
.modal{width:min(1020px,100%);max-height:90vh;overflow:auto;overscroll-behavior:contain;background:var(--panel);border-radius:22px;box-shadow:0 40px 90px -24px rgba(20,19,26,.55),0 0 0 1px rgba(20,19,26,.06);transform:translateY(12px) scale(.985);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.m-handle{display:none}
.velo.on .modal{transform:none}
.m-cab{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:20px 24px 15px;border-bottom:1px solid var(--linea-2);display:flex;gap:14px;align-items:flex-start}
.espina{width:6px;border-radius:4px;align-self:stretch;background:var(--c);flex:none;min-height:44px}
.m-cab h3{font-family:var(--display);font-size:21px;font-weight:700;margin:0;letter-spacing:-.03em;line-height:1.12}
.m-cab .t-sub{margin-top:7px}
/* modal tabs */
.m-resumen-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 24px;background:#FBFBFD;border-bottom:1px solid var(--linea-2);font-size:12.5px;align-items:center}
.m-resumen-bar b{font-weight:600}
.m-resumen-bar .pt{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.05em;margin-right:4px}
.m-tabs{display:flex;gap:2px;padding:0 24px;background:#FBFBFD;border-bottom:1px solid var(--linea-2)}
.m-tab{border:0;background:none;padding:10px 18px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;transition:all .12s}
.m-tab.on{color:var(--ink);border-bottom-color:var(--granate)}
.m-tab:hover:not(.on){color:var(--ink-2)}
.m-panel{padding:20px 24px 16px;display:flex;flex-direction:column;gap:20px;min-width:0}
.m-sec h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:9px}
.m-sec h4::after{content:"";flex:1;height:1px;background:var(--linea-2)}
.swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw{width:29px;height:29px;border-radius:10px;border:2px solid transparent;box-shadow:inset 0 0 0 2px #fff;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw:hover{transform:translateY(-1px)}
.opciones{display:grid;gap:10px}
.mini-sem{background:#F7F7FB;border-radius:10px;padding:7px 8px 8px;margin-bottom:10px}
.ms-dias{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px}
.ms-dias span{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.ms-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative;height:76px}
.ms-col{position:relative;background:#fff;border-radius:5px}
.ms-col span{position:absolute;left:2px;right:2px;border-radius:3px}
.ms-linea{position:absolute;left:0;right:0;border-top:1px dashed #D5D5E2;pointer-events:none}
.ms-pie{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.06em}
.opc{border:1.5px solid var(--linea);border-radius:14px;padding:13px 15px;background:#fff;text-align:left;width:100%;display:block;transition:border-color .15s,background .15s}
.opc:hover{border-color:#C7C7D6}
.opc[aria-pressed="true"]{border-color:var(--ink);background:#FBFBFD}
.opc-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:9px}
.opc-h b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.opc-h span{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.horario{display:grid;grid-template-columns:66px 1fr;gap:3px 12px;font-size:11.5px}
.horario .d{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.horario .s{color:var(--ink-2);line-height:1.5}
.horario .s em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink)}
.horario .s u{text-decoration:none;font-family:var(--mono);font-size:9px;background:#F0F0F5;border-radius:4px;padding:1px 4px;margin-left:3px;color:var(--ink-3)}
.horario .s.off{opacity:.38}
.sub-fila{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.sub-chip{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:6px 12px;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-2)}
.sub-chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
/* subgrupo cards */
.sub-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.sub-card{position:relative;border:2px solid var(--linea);border-radius:14px;padding:14px 16px;background:#fff;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;transition:all .15s;cursor:pointer}
.sub-card:hover{border-color:#C0C0D0;background:#FAFAFF}
.sub-card.on{border-color:var(--ink);background:#F5F5FA;box-shadow:0 2px 10px rgba(20,19,26,.1)}
.sc-nombre{font-family:var(--mono);font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.sc-horario{display:flex;flex-direction:column;gap:3px}
.sc-ses{font-size:12px;color:var(--ink-2);display:flex;align-items:baseline;gap:6px}
.sc-ses em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink)}
.sc-ses u{text-decoration:none;font-family:var(--mono);font-size:9px;background:#F0F0F5;border-radius:4px;padding:1px 5px;color:var(--ink-3)}
.sc-check{position:absolute;top:10px;right:12px;font-size:16px;color:var(--ink);font-weight:700}
.m-pie{position:sticky;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linea-2);padding:14px 24px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn.peligro{color:#A03325;border-color:#F1D9D5;background:#FEF8F7}
.btn.peligro:hover{background:#FBEDEB;color:#8E2A1E}
.pista{font-size:11.5px;color:var(--ink-3)}
.tarjeta .t-h{cursor:pointer}
.bq{cursor:pointer}
.bq:hover{filter:brightness(.92);box-shadow:0 4px 16px -2px rgba(20,19,26,.2);transform:translateY(-1px) scale(1.01)}

/* ───────── convocatoria badge ───────── */
.bq-ext{outline:2.5px dashed rgba(255,80,40,.8)!important;outline-offset:-2px}
.conv-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;vertical-align:1px}
.conv-badge.ord{background:#E8F5E9;color:#2E7D32}
.conv-badge.ext{background:#FBE9E7;color:#BF360C}
.conv-badge.ext.dif-alta{background:#FFCDD2;color:#B71C1C;animation:pulse-ext 2s infinite}
@keyframes pulse-ext{0%,100%{opacity:1}50%{opacity:.7}}
.conv-sel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.conv-btn{border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.conv-btn:hover{border-color:#C7C7D6}
.conv-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.conv-btn .conv-ico{font-size:14px}
.dif-toggle{display:flex;gap:4px;margin-left:6px}
.dif-dot{width:22px;height:22px;border:1.5px solid var(--linea);border-radius:7px;background:#fff;font-size:11px;display:grid;place-items:center;color:var(--ink-3)}
.dif-dot:hover{border-color:#C7C7D6}
.dif-dot.on{border-color:var(--alerta);background:#FBE9E7;color:var(--alerta)}

/* ── selector de turno en tarjeta ── */
.t-turnos{display:flex;gap:3px;padding:0 14px 6px;flex-wrap:wrap}
.t-turno{border:1.5px solid var(--linea);background:#FAFAFE;border-radius:7px;padding:4px 10px;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--ink-3);letter-spacing:.03em;transition:all .12s}
.t-turno:hover{border-color:var(--ink-2);color:var(--ink-2)}
.t-turno.on{border-color:var(--ink);background:var(--ink);color:#fff}

/* ── alerta/footer en tarjeta ── */
.t-footer{display:flex;gap:4px;align-items:center;padding:5px 14px 8px;border-top:1px solid var(--linea-2);flex-wrap:wrap}
.t-conv-btn{border:1.5px solid var(--linea);background:#fff;border-radius:7px;padding:4px 10px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);transition:all .12s}
.t-conv-btn:hover{border-color:var(--ink-2);color:var(--ink-2)}
.t-conv-btn.ord-on{border-color:#2E7D32;background:#E8F5E9;color:#2E7D32}
.t-conv-btn.ext-on{border-color:#BF360C;background:#FBE9E7;color:#BF360C}
.t-eval-tags{display:flex;gap:3px;flex-wrap:wrap;margin-left:auto}
.t-eval-tag{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:4px;background:#F0F0F5;color:var(--ink-3);letter-spacing:.03em}
.t-quitar{margin-left:auto;border:1px solid #F1D9D5;background:#FEF8F7;border-radius:7px;padding:3px 10px;font-family:var(--mono);font-size:8.5px;font-weight:600;color:#A03325;letter-spacing:.04em;text-transform:uppercase;transition:all .12s}
.t-quitar:hover{background:#FBEDEB;color:#8E2A1E}
.tarjeta.conv-ext{border-color:#E57373;background:#FFF8F7}
.tarjeta.conv-ext::before{background:#E53935}
.tarjeta.conv-ord{border-color:#A5D6A7;background:#F9FDF9}
/* alerta de importancia en tarjeta */
.t-alerta{display:flex;align-items:center;gap:6px;padding:6px 14px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.t-alerta.a-imp{background:#FFF8E1;color:#E65100;border-top:2px solid #FFB300}
.t-alerta.a-muyimp{background:#FFEBEE;color:#C62828;border-top:2px solid #FF1744;animation:pulse-ext 2s infinite}
.t-alerta .a-ico{font-size:13px}

/* ── evaluacion grid en modal ── */
.eval-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eval-item{display:flex;align-items:center;gap:8px;background:#FBFBFD;border:1px solid var(--linea-2);border-radius:12px;padding:10px 12px;transition:border-color .12s}
.eval-item:focus-within{border-color:var(--granate);background:#fff}
.eval-item label{font-size:11px;font-weight:600;color:var(--ink-2);flex:1;min-width:0;letter-spacing:-.01em}
.eval-item input[type="number"]{width:48px;padding:5px 2px;border:1.5px solid var(--linea);border-radius:8px;background:#fff;font-family:var(--mono);font-size:15px;font-weight:700;text-align:center;color:var(--ink);-moz-appearance:textfield;transition:border-color .12s}
.eval-item input[type="number"]:focus{border-color:var(--granate);outline:none}
.eval-item input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
.eval-item .pct{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:none;font-weight:600}
.eval-total{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-top:6px}
.eval-total.ok{background:#E8F5E9;border:1.5px solid #81C784}
.eval-total.warn{background:#FFF8E1;border:1.5px solid #FFB74D}
.eval-total.bad{background:#FFEBEE;border:1.5px solid #E57373}
.eval-bar{flex:1;height:10px;background:#E8E8EE;border-radius:5px;overflow:hidden}
.eval-bar-fill{height:100%;border-radius:5px;transition:width .25s,background .25s}
.eval-total-num{font-family:var(--mono);font-size:16px;font-weight:800;min-width:44px;text-align:right;letter-spacing:-.02em}
.eval-total.ok .eval-total-num{color:#2E7D32}
.eval-total.warn .eval-total-num{color:#E65100}
.eval-total.bad .eval-total-num{color:#C62828}
/* datos cards */
.datos-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dato-card{background:#FBFBFD;border:1.5px solid var(--linea-2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dato-card label{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.dato-card input,.dato-card select{padding:8px 10px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;font-size:13.5px;width:100%;transition:border-color .12s}
.dato-card input:focus,.dato-card select:focus{border-color:var(--granate);outline:none}
.notas-area{width:100%;min-height:80px;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;background:#FBFBFD;font-size:13px;line-height:1.5;resize:vertical;font-family:var(--ui);transition:border-color .12s}
.notas-area:focus{border-color:var(--granate);outline:none;background:#fff}

/* ───────── responsive: tablet ───────── */
@media (max-width:1120px){
  .pag-horario,.pag-asigs{padding:14px 16px 32px}
  .dos-cols{grid-template-columns:1fr 1fr;gap:12px}
  .lista{max-height:min(50vh,500px)}
  .sel-cuerpo{max-height:min(50vh,500px)}
  .metricas{gap:14px}
  .top-in{padding:10px 16px 0}
  .top-tabs{padding:0 16px}
  .m-panel{padding:16px 18px 12px}
}

/* ───────── responsive: movil ───────── */
@media (max-width:768px){
  /* ---- nav inferior fija ---- */
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(20,19,26,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);padding:0 0 env(safe-area-inset-bottom,0);height:calc(60px + env(safe-area-inset-bottom,0))}
  .mob-nav button{flex:1;border:0;background:none;color:#8E8DA0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:8px 0;transition:all .15s}
  .mob-nav button.activo{color:#fff}
  .mob-nav button.activo .mn-ico{background:var(--granate);transform:scale(1.1);box-shadow:0 0 12px rgba(122,30,46,.35)}
  .mn-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;transition:all .15s}

  /* ---- header compacto ---- */
  .top-in{flex-direction:row;align-items:center;gap:6px;padding:6px 10px 0;flex-wrap:nowrap}
  .kicker{display:none}
  .marca h1{font-size:15px;margin:0;white-space:nowrap}
  .marca h1 em{display:none}
  .metricas{gap:4px;padding-bottom:0;margin-left:auto;flex-shrink:0}
  .metrica{padding:4px 8px;border-radius:8px}
  .metrica b{font-size:13px}
  .metrica span{font-size:6.5px;margin-top:1px}
  .top-tabs{padding:0 10px;margin-top:4px;gap:0;overflow-x:auto}
  .tabs-sep{display:none}
  .tabs-pag{display:none}
  .tabs-cuat{gap:1px}
  .tab{padding:5px 12px;font-size:10.5px}

  /* ---- paginas en movil ---- */
  .pagina{display:none!important}
  .pagina.mob-activo{display:block!important}
  .pag-horario,.pag-asigs{padding:4px 4px calc(68px + env(safe-area-inset-bottom,0))}
  .dos-cols{grid-template-columns:1fr;gap:10px}

  /* en movil, "elegidas" es su propia vista */
  .pag-asigs [data-sec="seleccion"]{display:none}
  .pag-asigs.mob-show-sel [data-sec="catalogo"]{display:none}
  .pag-asigs.mob-show-sel [data-sec="seleccion"]{display:block}

  /* ---- catalogo ---- */
  .panel-h{padding:12px 14px;flex-wrap:wrap;gap:8px}
  .panel-h h2{font-size:15px}
  .panel-h .acciones{margin-left:0;width:100%;justify-content:flex-start}
  .filtros{padding:10px 14px;gap:8px;position:sticky;top:0;z-index:5;background:#FBFBFD;border-bottom:1px solid var(--linea-2)}
  .chips{gap:4px}
  .chip{padding:6px 12px;font-size:12px;border-radius:10px}
  .buscador{padding:10px 14px;font-size:15px;border-radius:12px}
  .lista{max-height:none;overflow:visible;padding:6px}
  .item{padding:12px 12px;gap:10px;border-radius:14px}
  .item .nom{font-size:14px}
  .grupo-titulo{padding:12px 8px 8px}
  .grupo-titulo b{font-size:14px}
  .tag{font-size:9px;padding:3px 8px}

  /* ---- seleccion ---- */
  .sel-cuerpo{max-height:none;overflow:visible;padding:6px}
  .tarjeta{margin:10px 2px;border-radius:16px}
  .tarjeta::before{width:6px}
  .t-h{padding:14px 14px 10px 18px}
  .t-h .nom{font-size:15px}
  .t-footer{padding:6px 16px 10px;gap:6px}
  .t-conv-btn{padding:6px 14px;font-size:11px;border-radius:9px}
  .t-turnos{padding:0 16px 8px;gap:4px}
  .t-turno{padding:5px 12px;font-size:9.5px;border-radius:9px}
  .curso-cab{padding:12px 8px 8px}
  .t-alerta{padding:8px 16px;font-size:10px}
  .sub-cards{grid-template-columns:1fr}
  .sub-card{padding:12px 14px;border-radius:12px}

  .acciones{flex:none;gap:3px}
  .btn{padding:5px 8px;font-size:9px;border-radius:8px}

  .cal-wrap{padding:0 0 6px;overflow:hidden}
  .cal-cab{grid-template-columns:32px repeat(5,1fr)}
  .cal-cab div{padding:6px 2px;font-size:7.5px;letter-spacing:.06em}
  .cal-cuerpo{grid-template-columns:32px repeat(5,1fr)}

  .bq .bq-detalle .bq-h{font-size:6px}
  .bq .tipo{font-size:5px;top:0;right:0;padding:0 2px;border-radius:2px}
  .bq .warn{display:none}
  .bq.aula::before{width:2px}
  .bq.bq-tall .bq-nombre{-webkit-line-clamp:3}

  /* ---- leyenda ---- */
  .leyenda{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ley-fila{padding:7px 10px;gap:4px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}

  .ley .lm{display:none}

  .velo{padding:0;align-items:flex-end}

  .espina{width:5px;min-height:38px;border-radius:6px}
  .m-resumen-bar{padding:12px 18px;font-size:12px}

  .m-tabs{padding:0 18px;gap:0;overflow-x:auto}
  .m-tab{padding:12px 18px;font-size:13px;white-space:nowrap}
  .m-panel{padding:20px 18px 16px;gap:22px}
  .m-sec h4{font-size:10px;letter-spacing:.14em;margin-bottom:14px}
  .m-pie{padding:14px 18px}

  .horario .s em{font-size:11.5px}
  .horario .s u{font-size:9px;padding:2px 6px;border-radius:5px}

  /* subgrupos */
  .sub-cards{grid-template-columns:1fr;gap:10px}
  .sub-card{padding:16px 18px;border-radius:16px;border-width:2px;gap:8px}
  .sub-card.on{border-width:2px}

  .sc-ses u{font-size:10px;padding:2px 7px}
  .sc-check{font-size:20px;top:14px;right:16px}

  .swatches{gap:8px;padding:4px 0}
  .sw{width:36px;height:36px;border-radius:12px;border-width:3px}

  /* eval */
  .eval-grid{grid-template-columns:1fr 1fr;gap:8px}
  .eval-item{padding:12px 12px;border-radius:14px}
  .eval-item label{font-size:12px}
  .eval-item input[type="number"]{font-size:18px;width:54px;padding:6px 4px;border-radius:10px}

  .eval-total-num{font-size:20px}

  .dato-card label{font-size:10px}
  .dato-card input,.dato-card select{font-size:16px;padding:12px 14px;border-radius:12px}

}

/* =========================================================
   COLOR POR ASIGNATURA (uno distinto dentro de cada curso y cuatrimestre)
   ========================================================= */
const PALETA = [
  "#E8A0B4","#7EC8C8","#92AADC","#E0B87A","#82C99A","#B89AD4","#D98BA8","#6EC5D0",
  "#C4A088","#95B0BC","#E09A6A","#9B92D0","#6EB8A8","#D08BA4","#8FAAB4","#B8A090",
  "#C8C070","#7A98D0","#D49A70","#6AAA70"
];
const COLOR_BASE = {};
[1,2,3,4].forEach(curso => [1,2].forEach(c => {
  let i = (curso - 1) * 5;
  ASIGS.filter(a => a.curso === curso && a.cuat === c)
       .forEach(a => { COLOR_BASE[a.id] = PALETA[i % PALETA.length]; i++; });
}));
function aclara(hex, p){
  const n = parseInt(hex.slice(1),16), r = n>>16, g = (n>>8)&255, b = n&255;
  const m = v => Math.round(v + (255 - v) * p);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function oscurece(hex, p){
  const n = parseInt(hex.slice(1),16), r = n>>16, g = (n>>8)&255, b = n&255;
  const m = v => Math.round(v * (1 - p));
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

const min = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const familia = g => g ? g[0] : null;
const colorDe = id => (estado.sel[id] && estado.sel[id].color) || COLOR_BASE[id];

function subgruposDe(op){
  const fam = {};
  op.ses.forEach(s => { const g = s[4]; if(g){ const f = familia(g); (fam[f] = fam[f] || []); if(!fam[f].includes(g)) fam[f].push(g); } });
  Object.keys(fam).forEach(f => fam[f].sort());
  return fam;
}
const opcionDe = (a,s) => a.ops.find(o => o.id === s.op) || a.ops[0];

function anadir(id, abrir){
  const a = porId[id], op = a.ops[0], fam = subgruposDe(op), sub = {};
  Object.keys(fam).forEach(f => sub[f] = fam[f][0]);
  estado.sel[id] = { op:op.id, sub, color:null, profesor:"", correo:"", notas:"", etiqueta:"", convocatoria:"", dificultad:0, evalOrd:{examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0}, evalExt:{examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0} };
  guardar(); pintar();
  if(abrir) abrirModal(id);
}
const quitar = id => { delete estado.sel[id]; guardar(); pintar(); };

/* =========================================================
   BLOQUES
   ========================================================= */
function bloquesVisibles(cuat){
  const out = [];
  Object.keys(estado.sel).forEach(id => {
    const a = porId[id]; if(!a || a.cuat !== cuat) return;
    const s = estado.sel[id], op = opcionDe(a,s);
    op.ses.forEach(ses => {
      const g = ses[4];
      if(g && s.sub[familia(g)] !== g) return;
      out.push({ asig:a, op, dia:ses[0], ini:min(ses[1]), fin:min(ses[2]),
                 etiqueta:ses[3], sub:g, aula:ses[5] || op.aula, nota:ses[6] || null });
    });
  });
  return out;
}
function detectarSolapes(bloques){
  bloques.forEach(b => b.choca = false);
  const pares = [];
  for(let i=0;i<bloques.length;i++) for(let j=i+1;j<bloques.length;j++){
    const x = bloques[i], y = bloques[j];
    if(x.dia === y.dia && x.ini < y.fin && y.ini < x.fin){ x.choca = y.choca = true; pares.push([x,y]); }
  }
  return pares;
}
function repartirColumnas(dia){
  dia.sort((a,b) => a.ini - b.ini || a.fin - b.fin);
  const grupos = []; let act = [], finMax = -1;
  dia.forEach(b => {
    if(act.length && b.ini >= finMax){ grupos.push(act); act = []; finMax = -1; }
    act.push(b); finMax = Math.max(finMax, b.fin);
  });
  if(act.length) grupos.push(act);
  grupos.forEach(gr => {
    const cols = [];
    gr.forEach(b => { let k = 0; while(cols[k] && cols[k] > b.ini) k++; cols[k] = b.fin; b.col = k; });
    gr.forEach(b => b.cols = cols.length);
  });
}
const tipoDe = b => !b.sub ? "teoria" : (familia(b.sub) === "L" ? "lab" : (familia(b.sub) === "T" ? "teoria" : "aula"));

      ev.pracIndiv ? `P.Ind ${ev.pracIndiv}%` : null,

      ev.participacion ? `Partic ${ev.participacion}%` : null,

    const turnHtml = a.ops.length > 1 ? `<div class="t-turnos">${a.ops.map(o =>
      `<button class="t-turno ${o.id===op.id?"on":""}" data-turno="${id}|${o.id}">${esc(o.n.replace("Grupo ","G").replace(" · Mañana","☀").replace(" · Tarde","☾").replace("Horario único · ",""))}</button>`
    ).join("")}</div>` : "";
    html += `<div class="tarjeta ${a.cuat!==estado.cuat?"otro":""}${convCls}" style="--c:${col}">
      ${alertaHtml}
      <div class="t-h" data-ficha="${id}" role="button" tabindex="0" title="Abrir ficha">

/* =========================================================
   VENTANA EMERGENTE
   ========================================================= */
function miniSemana(op, sub, col){
  const H = 76, R = FIN_DIA - INICIO_DIA;
  let cols = "";
  for(let d = 0; d < 5; d++){
    cols += `<div class="ms-col">` + op.ses.filter(s => s[0] === d).map(s => {
      const t = (min(s[1]) - INICIO_DIA) / R * H;
      const h = Math.max((min(s[2]) - min(s[1])) / R * H, 3);
      const fuera = sub && s[4] && sub[familia(s[4])] !== s[4];
      return `<span style="top:${t.toFixed(1)}px;height:${h.toFixed(1)}px;background:${col};opacity:${fuera?".26":"1"}"></span>`;
    }).join("") + `</div>`;
  }
  const linea = ((14*60) - INICIO_DIA) / R * H;
  return `<div class="mini-sem">
    <div class="ms-dias">${DIA_C.map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="ms-grid">${cols}<div class="ms-linea" style="top:${linea.toFixed(1)}px"></div></div>
    <div class="ms-pie"><span>08:30</span><span>14:00</span><span>21:30</span></div>
  </div>`;
}
function horarioHtml(a, op, sub){
  const porDia = {};
  op.ses.forEach(s => { (porDia[s[0]] = porDia[s[0]] || []).push(s); });
  let out = `<div class="horario">`;
  for(let d = 0; d < 5; d++){
    if(!porDia[d]) continue;
    const ss = porDia[d].slice().sort((x,y) => min(x[1]) - min(y[1]));
    out += `<div class="d">${DIA_C[d]}</div><div>` + ss.map(s => {
      const g = s[4];
      const fuera = sub && g && sub[familia(g)] !== g;
      return `<div class="s ${fuera?"off":""}"><em>${s[1]}–${s[2]}</em>${s[3]?` <u>${esc(s[3])}</u>`:""} ${esc(s[5]||op.aula)}${s[6]?" ⚠":""}</div>`;
    }).join("") + `</div>`;
  }
  return out + `</div>`;
}

  function evalBlock(prefix, label, evObj){
    const ev = evObj || {examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0};
    const t = ev.examen+ev.pracGrupal+ev.pracIndiv+ev.asistencia+ev.participacion+ev.otros;

    const col = t===100?"#4CAF50":t>100?"#F44336":"#FF9800";
    return `<div class="eval-grid">
      <div class="eval-item"><label>Examen</label><input type="number" min="0" max="100" data-ev="${id}|${prefix}|examen" value="${ev.examen}"><span class="pct">%</span></div>

      <div class="eval-item"><label>Asistencia</label><input type="number" min="0" max="100" data-ev="${id}|${prefix}|asistencia" value="${ev.asistencia}"><span class="pct">%</span></div>
      <div class="eval-item"><label>Participacion</label><input type="number" min="0" max="100" data-ev="${id}|${prefix}|participacion" value="${ev.participacion}"><span class="pct">%</span></div>
      <div class="eval-item"><label>Otros</label><input type="number" min="0" max="100" data-ev="${id}|${prefix}|otros" value="${ev.otros}"><span class="pct">%</span></div>
    </div>
    <div class="eval-total ${cls}">
      <div class="eval-bar"><div class="eval-bar-fill" style="width:${Math.min(t,100)}%;background:${col}"></div></div>
      <span class="eval-total-num">${t}%</span>
    </div>`;
  }

  const fichaEval = `
    <div class="m-sec"><h4>Convocatoria ordinaria</h4>
      ${evalBlock("evalOrd","Ordinaria",s.evalOrd)}
    </div>
    <div class="m-sec" style="margin-top:8px"><h4>Convocatoria extraordinaria</h4>
      ${evalBlock("evalExt","Extraordinaria",s.evalExt)}

  const fichaDatos = `

    <div class="m-sec"><h4>Tu configuracion</h4>

        <div class="dato-card">

            <option value="muy importante" ${s.etiqueta==="muy importante"?"selected":""}>Muy importante</option>
          </select>
        </div>
        <div class="dato-card">
          <label>Dificultad</label>
          <div class="dif-toggle" style="margin:0">
            ${[1,2,3,4,5].map(d => `<button class="dif-dot ${(s.dificultad||0)>=d?"on":""}" data-dif="${id}|${d}" title="${d}/5">${d}</button>`).join("")}
            <button class="dif-dot" data-dif="${id}|0" title="Quitar" style="margin-left:4px;font-size:9px">✕</button>
          </div>
        </div>
      </div>
    </div>
    <div class="m-sec"><h4>Notas personales</h4>
      <textarea class="notas-area" data-f="notas" data-id="${id}" placeholder="Lo que quieras recordar de esta asignatura…">${esc(s.notas)}</textarea>
    </div>`;

  return `<div class="m-handle"></div>
    <div class="m-cab" style="--c:${col}">
      <span class="espina"></span>

          <span class="tag">${a.ects} ECTS</span>
          <span class="tag ${a.tipo==="OP"?"op":""}">${a.tipo==="OP"?"optativa":"obligatoria"}</span>
          <span class="tag">${(Math.round(horas/6)/10).toString().replace(".",",")} h/sem</span>
        </span>
      </div>
      <button class="m-cerrar" id="m-cerrar" title="Cerrar">✕</button>
    </div>

    <div class="m-resumen-bar">
      <span class="pt">Tu horario</span>

    <div class="m-tabs" id="m-tabs">

function pintarModal(){
  const id = estado.abierta; if(!id || !estado.sel[id]) return;
  const m = document.getElementById("modal");
  const scroll = m.scrollTop;
  m.innerHTML = htmlModal(id);
  m.scrollTop = scroll;

  m.querySelector("#m-cerrar").onclick = cerrarModal;
  m.querySelector("#m-hecho").onclick = cerrarModal;
  m.querySelector("#m-quitar").onclick = () => { quitar(id); cerrarModal(); };

  /* tabs del modal */
  m.querySelectorAll(".m-tab").forEach(t => t.onclick = () => {
    m.querySelectorAll(".m-tab").forEach(o => o.classList.toggle("on", o === t));
    m.querySelectorAll(".m-panel").forEach(p => p.style.display = p.dataset.mpanel === t.dataset.mtab ? "" : "none");
  });

  m.querySelectorAll("[data-op]").forEach(b => b.onclick = () => {
    const [i,o] = b.dataset.op.split("|");
    estado.sel[i].op = o;
    const fam = subgruposDe(opcionDe(porId[i], estado.sel[i])), sub = {};
    Object.keys(fam).forEach(f => sub[f] = fam[f].includes(estado.sel[i].sub[f]) ? estado.sel[i].sub[f] : fam[f][0]);
    estado.sel[i].sub = sub; guardar(); pintar();
  });
  m.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => {
    const [i,f,g] = b.dataset.sub.split("|");
    estado.sel[i].sub[f] = g; guardar(); pintar();
  });
  m.querySelectorAll("[data-color]").forEach(b => b.onclick = () => {
    const [i,c] = b.dataset.color.split("|");
    estado.sel[i].color = c || null; guardar(); pintar();
  });
  m.querySelectorAll("[data-conv]").forEach(b => b.onclick = () => {
    const [i,v] = b.dataset.conv.split("|");
    estado.sel[i].convocatoria = (estado.sel[i].convocatoria === v) ? "" : v;
    guardar(); pintar();
  });
  m.querySelectorAll("[data-dif]").forEach(b => b.onclick = () => {
    const [i,d] = b.dataset.dif.split("|");
    estado.sel[i].dificultad = Number(d);
    guardar(); pintar();
  });
  m.querySelectorAll("[data-ev]").forEach(el => {
    el.oninput = () => {
      const parts = el.dataset.ev.split("|");
      const i = parts[0], prefix = parts[1], campo = parts[2];
      const defEv = {examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0};
      if(!estado.sel[i][prefix]) estado.sel[i][prefix] = {...defEv};
      estado.sel[i][prefix][campo] = Math.max(0, Math.min(100, Number(el.value) || 0));
      guardar();
      /* actualizar barra sin repintar todo (para no perder foco) */
      const ev = estado.sel[i][prefix];
      const t = ev.examen+ev.pracGrupal+ev.pracIndiv+ev.asistencia+ev.participacion+ev.otros;
      const wrap = el.closest(".m-sec");
      if(wrap){
        const bar = wrap.querySelector(".eval-bar-fill");
        const num = wrap.querySelector(".eval-total-num");
        const tot = wrap.querySelector(".eval-total");
        if(bar) bar.style.width = Math.min(t,100)+"%";
        if(bar) bar.style.background = t===100?"#4CAF50":t>100?"#F44336":"#FF9800";
        if(num) num.textContent = t+"%";
        if(tot){ tot.className = "eval-total "+(t===100?"ok":t>100?"bad":"warn"); }
      }
      pintarSeleccion();
    };
  });
  m.querySelectorAll("[data-f]").forEach(el => {
    el.oninput = () => { estado.sel[el.dataset.id][el.dataset.f] = el.value; guardar(); pintarSeleccion(); };
    el.onchange = el.oninput;
  });
}

function abrirModal(id){
  if(!estado.sel[id]) return;
  estado.abierta = id;
  document.getElementById("velo").classList.add("on");
  document.body.style.overflow = "hidden";
  pintarModal();
  document.getElementById("modal").scrollTop = 0;
}
function cerrarModal(){
  estado.abierta = null;
  document.getElementById("velo").classList.remove("on");
  document.body.style.overflow = "";
}

/* ─────── vistas ─────── */
function pintarVista(){
  const v = document.getElementById("vista");
  if(estado.vista === "cal"){ v.innerHTML = htmlCalendario(); engancharBloques(); }
  else if(estado.vista === "of"){ v.innerHTML = htmlOficial(); engancharOficial(); }
  else v.innerHTML = htmlNota();
}
function engancharBloques(){
  document.querySelectorAll("#vista .bq[data-asig]").forEach(b => b.onclick = () => abrirModal(b.dataset.asig));
}
function engancharLeyenda(){
  const cuerpo = document.querySelector("#vista .cal-cuerpo");
  document.querySelectorAll("#vista [data-ley]").forEach(el => {
    const id = el.dataset.ley;
    el.onclick = () => abrirModal(id);
    el.onmouseenter = () => {
      if(!cuerpo) return;
      cuerpo.classList.add("dim");
      cuerpo.querySelectorAll(`.bq[data-asig="${id}"]`).forEach(b => b.classList.add("on"));
    };
    el.onmouseleave = () => {
      if(!cuerpo) return;
      cuerpo.classList.remove("dim");
      cuerpo.querySelectorAll(".bq.on").forEach(b => b.classList.remove("on"));
    };
  });
}
function engancharOficial(){
  document.querySelectorAll("#vista [data-ofc]").forEach(b => b.onclick = () => {
    estado.ofCurso = Number(b.dataset.ofc); estado.ofGrupo = null; pintarVista();
  });
  document.querySelectorAll("#vista [data-ofg]").forEach(b => b.onclick = () => {
    estado.ofGrupo = b.dataset.ofg; pintarVista();
  });
  const solo = document.getElementById("of-solo");
  if(solo) solo.onclick = () => { estado.ofSolo = !estado.ofSolo; pintarVista(); };
  document.querySelectorAll("#vista .bq[data-add]").forEach(b => b.onclick = () => {
    const [id, opId, sub] = b.dataset.add.split("|");
    const a = porId[id];
    if(!estado.sel[id]){
      const op = a.ops.find(o => o.id === opId) || a.ops[0], fam = subgruposDe(op), s2 = {};
      Object.keys(fam).forEach(f => s2[f] = fam[f][0]);
      if(sub) s2[familia(sub)] = sub;
      estado.sel[id] = { op:op.id, sub:s2, color:null, profesor:"", correo:"", notas:"", etiqueta:"", convocatoria:"", dificultad:0, evalOrd:{examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0}, evalExt:{examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0} };
    }else{
      estado.sel[id].op = opId;
      const fam = subgruposDe(opcionDe(a, estado.sel[id])), s2 = {};
      Object.keys(fam).forEach(f => s2[f] = fam[f].includes(estado.sel[id].sub[f]) ? estado.sel[id].sub[f] : fam[f][0]);
      if(sub) s2[familia(sub)] = sub;
      estado.sel[id].sub = s2;
    }
    guardar(); pintar();
  });
}

function htmlRejilla(bloques, opt){
  opt = opt || {};

  /* ── recortar rango a las horas que realmente tienen bloques ── */
  let rangoIni = INICIO_DIA, rangoFin = FIN_DIA;
  if(bloques.length && !opt.oficial){
    const bMin = Math.min(...bloques.map(b => b.ini));
    const bMax = Math.max(...bloques.map(b => b.fin));
    rangoIni = Math.floor(bMin / 60) * 60;           // redondear abajo a hora entera
    rangoFin = Math.ceil(bMax / 60) * 60;             // redondear arriba a hora entera
    rangoIni = Math.max(rangoIni - 30, INICIO_DIA);   // 30 min margen
    rangoFin = Math.min(rangoFin + 30, FIN_DIA);
  }

  /* ── calcular px/min para encajar en pantalla ── */
  const rangoMin = rangoFin - rangoIni;
  const movil = window.innerWidth <= 768;
  let px;
  if(opt.px){
    px = opt.px;
  } else {
    // restar: header(~80/48) + barra(~44/36) + navmovil(56) + paddings
    const overhead = movil ? 160 : 170;
    const disponible = Math.max(window.innerHeight - overhead, movil ? 280 : 360);
    px = Math.max(disponible / rangoMin, movil ? 0.55 : 0.7);
    px = Math.min(px, movil ? 1.0 : PX_MIN_DEFAULT);
  }

  const alto = rangoMin * px;
  let horas = `<div class="horas" style="height:${alto}px">`;
  for(let m = rangoIni; m <= rangoFin; m += 60)
    horas += `<div class="hm" style="top:${(m-rangoIni)*px}px">${hhmm(m)}</div>`;
  horas += `</div>`;

  let dias = "";
  for(let d = 0; d < 5; d++){
    const delDia = bloques.filter(b => b.dia === d);
    repartirColumnas(delDia);
    let inner = "";
    for(let m = rangoIni; m <= rangoFin; m += 30)
      inner += `<div class="raya ${m%60===0?"h":""}" style="top:${(m-rangoIni)*px}px"></div>`;
    /* detectar desdobles: bloques de la misma asignatura solapados en el mismo día */
    const desdobles = new Set();
    for(let i=0;i<delDia.length;i++) for(let j=i+1;j<delDia.length;j++){
      const a=delDia[i], bb=delDia[j];
      if(a.asig.id===bb.asig.id && a.ini<bb.fin && bb.ini<a.fin){ desdobles.add(i); desdobles.add(j); }
    }
    delDia.forEach((b,idx) => {
      const t = tipoDe(b), col = colorDe(b.asig.id);
      /* colores pastel: teoria=base, aula=mas claro, lab=mas oscuro */
      let fondo = col;
      if(estado.tonos){
        if(t === "aula") fondo = aclara(col, .35);
        else if(t === "lab") fondo = oscurece(col, .15);
      }
      const gap = movil ? 1 : 2;
      const top = (b.ini - rangoIni) * px + gap;
      const h = Math.max((b.fin - b.ini) * px - gap*2, movil ? 18 : 34);
      const w = 100 / (b.cols||1), x = w * (b.col||0);
      const extra = opt.oficial ? (b.mia ? " mia" : " nomia") : "";
      const dato = opt.oficial ? `data-add="${b.asig.id}|${b.op.id}|${b.sub||""}"` : `data-asig="${b.asig.id}"`;
      const selB = estado.sel[b.asig.id];
      const convCls = (!opt.oficial && selB && selB.convocatoria === "ext") ? " bq-ext" : "";
      const impCls = (!opt.oficial && selB && selB.etiqueta === "importante") ? " bq-imp"
                   : (!opt.oficial && selB && selB.etiqueta === "muy importante") ? " bq-muyimp" : "";
      const desCls = desdobles.has(idx) ? " desdoble" : "";
      const tallCls = h > (movil ? 40 : 48) ? " bq-tall" : "";
      const borderCol = oscurece(col, .3);
      const pad = movil ? 1 : 3;
      inner += `<div class="bq ${t} ${b.choca?"choca":""}${extra}${convCls}${impCls}${desCls}${tallCls}" ${dato}
        style="top:${top}px;height:${h}px;left:calc(${x}% + ${pad}px);width:calc(${w}% - ${pad*2}px);background:${fondo};border-color:${borderCol}"
        title="${esc(b.asig.n)} · ${hhmm(b.ini)}–${hhmm(b.fin)} · ${b.sub||"T"} · ${esc(b.aula||"")}">
        <span class="tipo">${b.sub ? esc(b.sub) : "T"}</span>
        <span class="bq-nombre">${esc(b.asig.n)}</span>
        <span class="bq-detalle"><span class="bq-h">${hhmm(b.ini)}–${hhmm(b.fin)}</span> ${esc(b.aula||"")}</span>
      </div>`;
    });
    dias += `<div class="dia" style="height:${alto}px">${inner}</div>`;
  }
  return `<div class="cal-wrap"><div class="cal-cab"><div></div>${DIAS.map(d=>`<div>${d}</div>`).join("")}</div>
    <div class="cal-cuerpo">${horas}${dias}</div></div>`;
}

function htmlCalendario(){
  const bloques = bloquesVisibles(estado.cuat);
  const pares = detectarSolapes(bloques);

  if(!bloques.length){
    return `<div class="cal-vacio">Tu semana del ${estado.cuat===1?"1.er":"2.º"} cuatrimestre está vacía.<br>
      Elige asignaturas a la izquierda. Después, pulsa cualquier bloque para abrir su ficha.</div>`;
  }

  let avisos = "";
  const vistos = new Set(), conf = [];
  pares.forEach(([x,y]) => {
    const k = [x.asig.id,x.dia,x.ini,y.asig.id,y.ini].join("|");
    if(vistos.has(k)) return; vistos.add(k);
    conf.push(`${DIAS[x.dia]} · <b>${esc(x.asig.n)}</b> ${hhmm(x.ini)}–${hhmm(x.fin)} choca con <b>${esc(y.asig.n)}</b> ${hhmm(y.ini)}–${hhmm(y.fin)}`);
  });
  const dudas = bloques.filter(b => b.nota).map(b =>
    `${DIAS[b.dia]} ${hhmm(b.ini)}–${hhmm(b.fin)} · <b>${esc(b.asig.n)}</b>: ${esc(b.nota)}`);
  if(conf.length) avisos += `<div class="aviso-caja rojo"><b>${conf.length} solape${conf.length>1?"s":""}</b><ul>${conf.map(c=>`<li>${c}</li>`).join("")}</ul>
    <div style="margin-top:6px">Pulsa la asignatura para cambiar de turno o de subgrupo y deshacer el choque.</div></div>`;
  if(dudas.length) avisos += `<div class="aviso-caja ambar"><b>Erratas del PDF que conviene confirmar en Secretaría</b><ul>${dudas.map(c=>`<li>${c}</li>`).join("")}</ul></div>`;

  return avisos + htmlRejilla(bloques);
}

/* ─────── tablas oficiales ─────── */
function celdasDe(a, op){
  const porDia = {};
  op.ses.forEach(s => { (porDia[s[0]] = porDia[s[0]] || []).push(s); });
  const celdas = [];
  Object.keys(porDia).forEach(d => {
    const ss = porDia[d].slice().sort((x,y) => min(x[1]) - min(y[1]));
    let bloque = [ss[0]];
    for(let i = 1; i < ss.length; i++){
      const finPrev = Math.max(...bloque.map(b => min(b[2])));
      if(min(ss[i][1]) - finPrev <= 60) bloque.push(ss[i]);
      else { celdas.push({dia:+d, ses:bloque}); bloque = [ss[i]]; }
    }
    celdas.push({dia:+d, ses:bloque});
  });
  return celdas;
}

function gruposDe(curso, cuat){
  const g = [];
  ASIGS.filter(a => a.curso === curso && a.cuat === cuat)
       .forEach(a => a.ops.forEach(o => { if(!g.includes(o.n)) g.push(o.n); }));
  return g.sort();
}

function htmlOficial(){
  const curso = estado.ofCurso, gs = gruposDe(curso, estado.cuat);
  if(!gs.length) return `<div class="cal-vacio">No hay horarios de ${ORD[curso-1]} curso en este cuatrimestre.</div>`;
  if(!gs.includes(estado.ofGrupo)) estado.ofGrupo = gs[0];

  const ctrl = `<div class="of-ctrl">
      <span class="ley-rot">Curso</span>
      ${[1,2,3,4].map(c => `<button class="chip" data-ofc="${c}" aria-pressed="${c===curso}">${ORD[c-1]}</button>`).join("")}
      <span class="sep"></span>
      <span class="ley-rot">Grupo</span>
      ${gs.map(g => `<button class="chip" data-ofg="${esc(g)}" aria-pressed="${g===estado.ofGrupo}">${esc(g)}</button>`).join("")}
      <span class="sep"></span>
      <button class="btn" id="of-solo" aria-pressed="${estado.ofSolo}">Solo mis asignaturas</button>
    </div>`;

  const delCurso = ASIGS.filter(a => a.curso === curso && a.cuat === estado.cuat &&
                                     a.ops.some(o => o.n === estado.ofGrupo) &&
                                     (!estado.ofSolo || estado.sel[a.id]));
  const bloques = [], aulas = new Set();
  delCurso.forEach(a => {
    const op = a.ops.find(o => o.n === estado.ofGrupo);
    aulas.add(op.aula);
    op.ses.forEach(x => bloques.push({
      asig:a, op, dia:x[0], ini:min(x[1]), fin:min(x[2]), etiqueta:x[3], sub:x[4],
      aula:x[5] || op.aula, nota:x[6] || null,
      mia: !!(estado.sel[a.id] && estado.sel[a.id].op === op.id &&
              (!x[4] || estado.sel[a.id].sub[familia(x[4])] === x[4]))
    }));
  });
  bloques.forEach(b => b.choca = false);

  const cuerpo = bloques.length
    ? `<div class="of-cal">${htmlRejilla(bloques, {oficial:true, px:0.95})}</div>`
    : `<div class="cal-vacio">No tienes ninguna asignatura elegida en este grupo.</div>`;

  const tabla = `<table class="of-prof"><thead><tr>
      <th></th><th>Asignatura</th><th>Profesor/a</th><th>Sesiones</th><th style="text-align:center">ECTS</th></tr></thead><tbody>
    ${ASIGS.filter(a => a.curso === curso && a.cuat === estado.cuat).map(a => {
      const op = a.ops.find(o => o.n === estado.ofGrupo);
      const sel = !!estado.sel[a.id];
      const p = sel && estado.sel[a.id].profesor;
      const det = op ? [...new Set(op.ses.map(x => x[3] || "—"))].join(" · ") : "otro grupo";
      return `<tr class="${sel?"sel":""}">
        <td class="pill-c"><span class="pto" style="background:${colorDe(a.id)}"></span></td>
        <td>${esc(a.n)}${a.tipo==="OP"?' <span class="tag op">optativa</span>':""}</td>
        <td class="${p?"":"vacio-p"}">${p ? esc(p) : "el PDF no lo indica"}</td>
        <td style="font-family:var(--mono);font-size:10.5px;color:var(--ink-3)">${esc(det)}</td>
        <td class="ects">${a.ects}</td></tr>`;
    }).join("")}</tbody></table>`;

  return ctrl + `<div class="of-tit"><h3>${ORD[curso-1]} curso · ${esc(estado.ofGrupo)}</h3>
      <span>${estado.cuat===1?"1.er":"2.º"} cuatrimestre · aula ${esc([...aulas].join(" / ")) || "—"} · ${bloques.length} sesiones</span></div>
    <div class="of-pista">Este es el horario tal cual lo publica la Facultad, con todos los subgrupos a la vez. Las que ya tienes elegidas van con borde negro; pulsa cualquier otra para añadirla con ese turno y ese subgrupo.</div>`
    + cuerpo + tabla;
}

function htmlNota(){

    <p>Los estudiantes matriculados en el PDTO Turismo-Publicidad se integran en los grupos del turno de mañana (Grupo 1) en los cursos 1.º y 2.º. A partir de 3.º pueden elegir turno.</p>
    <p>En algunos casos, los tiempos de docencia están divididos entre sesiones teóricas (T) y prácticas, divididas a su vez en aula (A) y laboratorio (L). Para las prácticas, el grupo se divide en dos subgrupos: en turno de mañana <code>A1</code> y <code>A3</code>, y en turno de tarde <code>A2</code> y <code>A4</code>. El estudiante asiste a todas las sesiones teóricas, pero solo a las de su subgrupo.</p>
    <p>Las horas marcadas en rojo en el PDF aluden a tiempos completos de referencia, quedando luego detallados los tiempos reales de cada sesión. Este planificador coloca los <b>tiempos reales</b>, no la franja de referencia.</p>

    <h4>Cómo se usa</h4>
    <ul>
      <li>Pulsa una asignatura del catálogo para añadirla. Si tiene más de un turno, se abre su ficha para que elijas viendo el horario completo de cada uno, día a día.</li>
      <li>Pulsa cualquier bloque del calendario, o una tarjeta de tu selección, para abrir esa misma ficha: turno, subgrupo, color, profesor, correo, criterios y notas.</li>
      <li>Bloque de color liso = teoría. Tono claro con filo de color = práctica de aula. Rayado = laboratorio. La etiqueta de la esquina indica el subgrupo.</li>
      <li>Cada asignatura nace con un color propio dentro de su curso y cuatrimestre, y lo cambias desde su ficha.</li>
    </ul>

    <h4>Erratas detectadas en el PDF</h4>
    <p>En cinco celdas el detalle horario impreso no encaja con la franja de referencia de su cabecera, y en tres de ellas además provocaría un choque con otra asignatura del mismo grupo. El planificador coloca la hora coherente y marca el bloque con <b>⚠</b>. Conviene confirmarlas en Secretaría:</p>
    <ul>
      <li><b>Teoría del lenguaje</b> · 1.º, Grupo 2, miércoles: detalle 15:00–15:40 y 15:40–19:00 dentro de una franja de 17:00 a 20:30, que además pisaría a Teorías de la comunicación. Colocado en 17:00–17:40 y 17:40–19:00.</li>
      <li><b>Sociología de la publicidad y del consumo</b> · 2.º, Grupo 1, viernes: subgrupo 3A impreso como 12:00–12:20 en una franja de 12:00 a 13:30. Colocado en 12:00–13:20.</li>
      <li><b>Métodos y técnicas de investigación social</b> · 2.º, Grupo 2, miércoles: detalle 18:00–19:20 bajo una franja de 19:00 a 20:30, que además pisaría a Los anunciantes. Colocado en 19:00–20:20.</li>
      <li><b>Teoría crítica de la cultura</b> · 4.º, Grupo 2, lunes y martes: detalle 17:00–18:20 bajo una franja de 15:00 a 16:30, que además pisaría a Producción y realización publicitarias. Colocado en 15:00–16:20.</li>
    </ul>

    <h4>Otros detalles del PDF recogidos aquí</h4>
    <ul>
      <li>Psicología de la comunicación (2.º) tiene un tercer grupo de mañana, <b>Grupo 3</b>, en el aula A-216.</li>
      <li>Sesiones marcadas “sin PDTO”: Historia de la publicidad y Sistemas de información (1.º, 1.er cuat.), Teoría de la publicidad (1.º, 2.º cuat.) y Psicología de la comunicación (2.º, 1.er cuat.).</li>
      <li>Laboratorio de fotografía (3.º) tiene dos sesiones de teoría, T1 y T2: eliges una en la ficha.</li>
      <li>Aulas distintas a la del grupo: A-108, A-219, G-121, G-122, G-123, G-208, G-214, Li002, Li004, Li007 y Lab. Diseño.</li>

}

function pintarMetricas(){
  const ids = Object.keys(estado.sel).filter(i => porId[i]);
  const bloques = bloquesVisibles(estado.cuat);
  const pares = detectarSolapes(bloques);
  const vistos = new Set(); let n = 0;
  pares.forEach(([x,y]) => { const k = [x.asig.id,x.dia,x.ini,y.asig.id,y.ini].join("|"); if(!vistos.has(k)){ vistos.add(k); n++; } });
  const minutos = bloques.reduce((t,b) => t + (b.fin - b.ini), 0);
  document.getElementById("m-asigs").textContent = ids.length;
  document.getElementById("m-ects").textContent = ids.reduce((t,i) => t + porId[i].ects, 0);
  document.getElementById("m-horas").textContent = (Math.round(minutos/6)/10).toString().replace(".",",");
  document.getElementById("m-choques").textContent = n;
  const n1 = ids.filter(i => porId[i].cuat===1).length, n2 = ids.length - n1;
  const ects1 = ids.filter(i => porId[i].cuat===1).reduce((t,i)=>t+porId[i].ects,0);
  const ects2 = ids.filter(i => porId[i].cuat===2).reduce((t,i)=>t+porId[i].ects,0);
  const cs = document.getElementById("c-seleccion");
  if(cs) cs.textContent = ids.length ? `${ids.length} elegidas · C1 ${n1} (${ects1} ECTS) · C2 ${n2} (${ects2} ECTS)` : "";
  document.getElementById("m-choques-w").classList.toggle("mal", n > 0);
}

/* =========================================================
   GUARDADO Y EVENTOS
   ========================================================= */
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify({sel:estado.sel, cuat:estado.cuat, tonos:estado.tonos})); }catch(e){} }
function cargarPreseleccion(){
  PRESELECCION.forEach(([id, opId]) => {
    const a = porId[id]; if(!a) return;
    const op = a.ops.find(o => o.id === opId) || a.ops[0], fam = subgruposDe(op), sub = {};
    Object.keys(fam).forEach(f => sub[f] = fam[f][0]);
    estado.sel[id] = { op:op.id, sub, color:null, profesor:"", correo:"", notas:"", etiqueta:"", convocatoria:"", dificultad:0, evalOrd:{examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0}, evalExt:{examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0} };
  });
}
function cargar(){
  try{
    const d = JSON.parse(localStorage.getItem(CLAVE) || "null");
    if(d && d.sel && Object.keys(d.sel).length){
      const defEv = {examen:0,pracGrupal:0,pracIndiv:0,asistencia:0,participacion:0,otros:0};
      Object.keys(d.sel).forEach(k => {
        const s = d.sel[k];
        if(!s || !s.op){ delete d.sel[k]; return; }
        if(!s.convocatoria) s.convocatoria = "";
        if(!s.dificultad) s.dificultad = 0;
        if(!s.etiqueta) s.etiqueta = "";
        if(!s.notas) s.notas = "";
        if(!s.profesor) s.profesor = "";
        if(!s.correo) s.correo = "";
        if(!s.evalOrd) s.evalOrd = s.eval ? {...defEv,...s.eval} : {...defEv};
        if(!s.evalExt) s.evalExt = {...defEv};
        delete s.eval;
      });
      if(Object.keys(d.sel).length){
        estado.sel = d.sel; estado.cuat = d.cuat || 1; estado.tonos = !!d.tonos;
        return;
      }
    }
  }catch(e){
    try{ localStorage.removeItem(CLAVE); }catch(x){}
  }
  cargarPreseleccion();
}

/* =========================================================
   NAVEGACION POR PAGINAS (escritorio + movil)
   ========================================================= */
function esMovil(){ return window.innerWidth <= 768; }
let paginaActual = "horario";

function irAPagina(pag){
  paginaActual = pag;
  document.querySelectorAll(".pagina").forEach(el => el.classList.remove("activa"));
  const target = document.querySelector(`[data-pag-id="${pag}"]`);
  if(target) target.classList.add("activa");
  document.querySelectorAll(".tab-pag").forEach(b => b.setAttribute("aria-selected", b.dataset.pag === pag));
  if(pag === "horario") pintarVista();
}

/* tabs de pagina en header */
document.querySelectorAll(".tab-pag").forEach(b => b.onclick = () => irAPagina(b.dataset.pag));

/* tabs de cuatrimestre */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  estado.cuat = Number(t.dataset.cuat);
  document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-selected", o === t));
  guardar(); pintar();
});

/* vista calendario/tablas/nota */
document.getElementById("seg-vista").querySelectorAll("button").forEach(b => b.onclick = () => {
  estado.vista = b.dataset.vista;
  document.getElementById("seg-vista").querySelectorAll("button").forEach(o => o.setAttribute("aria-pressed", o === b));
  pintarVista();
});

/* controles */
document.getElementById("buscador").oninput = e => { estado.q = e.target.value; pintarCatalogo(); };
document.getElementById("btn-tonos").onclick = e => {
  estado.tonos = !estado.tonos;
  e.currentTarget.setAttribute("aria-pressed", estado.tonos);
  guardar(); pintarVista();
};
document.getElementById("btn-imprimir").onclick = () => window.print();
document.getElementById("btn-limpiar").onclick = () => { if(confirm("¿Vaciar toda la selección?")){ estado.sel = {}; cerrarModal(); guardar(); pintar(); } };
document.getElementById("velo").onclick = e => { if(e.target.id === "velo") cerrarModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape" && estado.abierta) cerrarModal(); });

document.getElementById("btn-exportar").onclick = () => {
  const blob = new Blob([JSON.stringify({sel:estado.sel, cuat:estado.cuat}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "mi-matricula-publicidad-2627.json"; a.click();
};
document.getElementById("btn-copiar").onclick = () => {
  const ids = Object.keys(estado.sel).filter(i => porId[i])
    .sort((x,y) => porId[x].curso - porId[y].curso || porId[x].cuat - porId[y].cuat);
  const txt = ids.map(id => {
    const a = porId[id], s = estado.sel[id], op = opcionDe(a,s);
    const subs = Object.keys(subgruposDe(op)).map(f => s.sub[f]).join("/");
    return `${a.curso}.º · ${a.cuat===1?"C1":"C2"} · ${a.n} · ${op.n}${subs?" · "+subs:""} · ${a.ects} ECTS`;
  }).join("\n");
  navigator.clipboard.writeText(txt || "(selección vacía)").then(
    () => { const b = document.getElementById("btn-copiar"); b.textContent = "Copiada"; setTimeout(()=>b.textContent="Copiar", 1600); },
    () => prompt("Copia esta lista:", txt));
};
document.getElementById("btn-importar").onclick = () => document.getElementById("fichero").click();
document.getElementById("fichero").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(d && d.sel){
        estado.sel = d.sel; estado.cuat = d.cuat || estado.cuat;
        document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-selected", Number(o.dataset.cuat)===estado.cuat));
        guardar(); pintar();
      }
    }catch(err){ alert("Ese archivo no tiene el formato esperado. Usa el que genera el botón Guardar."); }
  };
  r.readAsText(f);
};

/* =========================================================
   NAVEGACION MOVIL (3 ventanas)
   ========================================================= */
function cambiarMob(sec){
  const pagAsigs = document.querySelector(".pag-asigs");
  document.querySelectorAll(".pagina").forEach(el => { el.classList.remove("mob-activo"); });
  document.querySelectorAll("#mob-nav button").forEach(b => b.classList.toggle("activo", b.dataset.mob === sec));
  pagAsigs.classList.remove("mob-show-sel");

  if(sec === "horario"){
    document.querySelector(".pag-horario").classList.add("mob-activo");
    pintarVista();
  } else if(sec === "asigs"){
    pagAsigs.classList.add("mob-activo");
  } else if(sec === "elegidas"){
    pagAsigs.classList.add("mob-activo","mob-show-sel");
  }
}

document.getElementById("mob-nav").querySelectorAll("button").forEach(b => {
  b.onclick = () => cambiarMob(b.dataset.mob);
});

/* al anadir asignatura en movil, saltar al horario */
const _anadirOriginal = anadir;
anadir = function(id, abrir){
  _anadirOriginal(id, abrir);
  if(esMovil() && !abrir) cambiarMob("horario");
};

/* arranque - limpiar datos corruptos de versiones anteriores */
try{ if(!localStorage.getItem("uva-v3-ok")){ localStorage.removeItem(CLAVE); localStorage.setItem("uva-v3-ok","1"); } }catch(e){}
cargar();
document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-selected", Number(o.dataset.cuat)===estado.cuat));
document.getElementById("btn-tonos").setAttribute("aria-pressed", estado.tonos);
pintar();

/* en movil, activar la primera vista */
if(esMovil()) cambiarMob("horario");

/* recalcular calendario al cambiar tamano */
let _rzTimer;
window.addEventListener("resize", () => {
  clearTimeout(_rzTimer);
  _rzTimer = setTimeout(() => {
    if(paginaActual === "horario" || esMovil()) pintarVista();
  }, 200);
});

</script>
